<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0805">
<title>DISTRIBUTION Manager</title>
<meta name="app-version" content="0.7.4">
<meta name="apple-mobile-web-app-title" content="DISTRIBUTION Manager">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* 配色：黒と金。EARN VIEWER の作り（グラデーションの背景、光る上辺のカード、下のアイコン付きタブ）を金色で */
  :root{
    --bg:#07060a; --card:#17130c; --card-2:#0e0b07;
    --text:#f7f0de; --muted:#b9ab8a;
    --line:rgba(214,180,100,.22); --edge:rgba(232,200,120,.45);
    --gold-1:#fff1c1; --gold-2:#ecc864; --gold-3:#c99a2e; --gold-4:#8a6414;
    --accent:#e6bf55; --accent-2:#b0841f; --glow:rgba(240,200,90,.45);
    --sky:#9fc3ff; --in:#7fdca8; --out:#ff958a; --gold:#ecd28f; --note-text:#f3d68f; --third:#d6b6ff;
    /* グラフの人の色：金の濃淡（明るさで見分ける。線は実線・破線・点線も変える） */
    --s1:#d1a23a; --s2:#f5dc8c; --s3:#94681c; --grid:rgba(214,180,100,.16);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}  /* 隠したものは、表示の指定（flex など）があっても出さない */
  html{background:var(--bg)}
  body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Meiryo UI",sans-serif;
    background:radial-gradient(120% 60% at 50% -10%, #3a2a0c 0%, #171006 45%, var(--bg) 75%) fixed, var(--bg)}
  /* ヘッダ */
  .appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;
    background:linear-gradient(180deg,#1c150a,#0a0805);border-bottom:1px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.45)}
  .appbar .logo{width:28px;height:28px;border-radius:7px;flex:none;box-shadow:0 0 10px var(--glow)}
  .appbar h1{flex:1;margin:0;font-size:clamp(13px,4.2vw,17px);font-weight:800;letter-spacing:.08em;white-space:nowrap;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{flex:none;font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap;
    color:#1a1204;background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));box-shadow:0 0 8px var(--glow)}
  .appbar h1{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
  /* ヘッダの右：EV と同じく「Version：版」。押したまま（マウスを乗せる）でデータの作成日時。更新中は「更新中…」 */
  .appver{margin-left:auto;flex:none;white-space:nowrap;font-size:clamp(11px,3.4vw,14px);color:var(--text);opacity:.9}
  .note.update{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .note.update button{padding:4px 12px;border-radius:8px;border:1px solid var(--gold-2);background:var(--card-2);color:var(--gold-1);cursor:pointer}
  .appbar .seg button{padding:4px 10px;font-size:12px}
  .wrap{max-width:480px;margin:0 auto;padding:12px 16px calc(92px + env(safe-area-inset-bottom));overflow-x:clip}
  .note .ver{float:right;opacity:.7}
  .note{font-size:12px;color:var(--note-text);background:rgba(250,200,80,.10);border-radius:8px;padding:6px 10px;margin-bottom:10px}
  h2{font-size:15px;color:var(--text);font-weight:600;margin:18px 0 8px}
  /* カード：上から下へのグラデーション、金の細い枠、上辺の光 */
  .card{position:relative;background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);border:1px solid var(--edge);border-radius:14px;padding:14px;margin-bottom:10px}
  .card::before{content:'';position:absolute;top:-1px;left:18%;right:18%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold-1),transparent);box-shadow:0 0 14px 3px var(--glow);pointer-events:none}
  .head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}  /* 次回分配予定の欄は文字の幅ぴったり */
  .next{border-left:1px solid var(--line);padding-left:8px;display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
  .next .d{font-size:20px;font-weight:bold;line-height:1.2;color:var(--text)}
  .next .y{font-size:11px;color:var(--muted)}
  .hero-row{display:flex;align-items:center;gap:8px}
  .big{font-size:30px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .big.hero{background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 50%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(240,200,90,.30))}
  .big.hero .unit{-webkit-text-fill-color:var(--muted)}
  .unit{font-size:14px;color:var(--muted);margin-left:4px;font-weight:normal}
  .yen{font-size:14px;color:var(--text);margin-top:2px}
  .rate{font-size:11px;color:var(--muted)}
  .label{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
  .grid div b{display:block;font-size:16px}
  .grid3{grid-template-columns:1fr 1fr 1fr}
  .grid3{gap:8px 6px}
  .grid3 b{font-size:clamp(11px,3.4vw,16px);white-space:nowrap}  /* 3列の欄は数字と USDT を1行に収める */
  .nw{white-space:nowrap}  /* 数字と USDT の間では折り返さない */
  .person-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  /* 個人別：名前の行の右に、自分は残高・相手は預り金（一番上のウォレット残高 30px より少し小さい 22px）と円の目安 */
  .person-head .ph-amt{display:grid;grid-template-columns:auto auto;align-items:baseline;justify-items:end;column-gap:6px;text-align:right}
  .person-head .ph-l{font-size:11px;color:var(--muted)}
  .person-head .big.ph{font-size:22px;line-height:1.15}
  .person-head .big.ph .unit{font-size:11px}
  .person-head .ph-amt .rate{grid-column:2}
  .label.hlabel{font-size:14px}
  .label.hlabel .rate{font-size:12px}
  .person-head .name{font-weight:bold;font-size:16px}
  .person-head .ratio{font-size:12px;color:var(--muted)}
  .sw.gold{background:linear-gradient(135deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));box-shadow:0 0 6px var(--glow)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
  /* 残りの棒：金のグラデーション */
  .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.45);margin:10px 0 4px;box-shadow:inset 0 0 0 1px var(--line)}
  .bar .g{background:var(--sky)} .bar .u{background:var(--out)}
  .bar .r{background:linear-gradient(90deg,var(--gold-4),var(--gold-3) 35%,var(--gold-2) 75%,var(--gold-1));box-shadow:0 0 10px var(--glow)}
  /* 内訳で塗り分ける棒：濃さは割合ではなく種類で決める（暗い金→明るい金）。すき間 2px */
  /* 3つの金：上が明るく下が濃い、つやのある縦のグラデーション。明るさの差で見分ける */
  .kh{background:linear-gradient(180deg,#fffbea 0%,#f8e4a2 45%,#e9c35e 100%)}
  .ks{background:linear-gradient(180deg,#fbe39a 0%,#e6b84a 50%,#c39028 100%)}
  .kw{background:linear-gradient(180deg,#f3c25c 0%,#cf9220 50%,#a46a10 100%)}
  .bar .kh{box-shadow:0 0 10px var(--glow)}
  .bar span+span{border-left:2px solid var(--card-2)}
  .barcap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px}
  .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 3px 0 0;vertical-align:baseline}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-bottom:6px}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .row .l{font-size:13px} .row .s{font-size:11px;color:var(--muted)}
  .row .a{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .row.cancel .l,.row.cancel .a{text-decoration:line-through;opacity:.5}
  /* 数字の色は残高の大きな数字以外、分配と同じ色にそろえる */
  .amt-in,.amt-out,.amt-give,.amt-third{color:var(--text)}
  .row .a.one{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .row .a.one b{font-size:clamp(14px,4.4vw,18px)}
  .us{font-size:.72em;font-weight:normal;color:var(--muted)}
  table.sum .us{display:block;font-size:9px;line-height:1.1}
  .unit-note{margin-left:auto;font-size:11px;font-weight:normal;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:8px;border:1px solid var(--line);color:var(--muted);margin-left:4px;text-decoration:none}
  .tag.ok{color:var(--in);border-color:var(--in)}
  .tag.wait{color:var(--note-text);border-color:var(--note-text)}
  .tag.no{color:var(--out);border-color:var(--out)}
  button{font:inherit}
  .mini{font-size:11px;padding:3px 9px;border-radius:8px;border:1px solid var(--edge);background:var(--card-2);color:var(--muted);cursor:pointer;margin-top:4px}
  .mini.go{border-color:var(--gold-2);color:var(--gold-1)}
  /* 切り替えボタン（EARN VIEWER の seg を金に） */
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--card-2)}
  .seg button{border:0;padding:6px 14px;background:transparent;color:var(--muted);cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,var(--gold-2),var(--accent-2));color:#1a1204;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,235,170,.6)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chips span{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--edge);color:var(--muted);cursor:pointer;background:var(--card-2)}
  .chips span.on{border-color:var(--gold-2);color:#1a1204;font-weight:700;background:linear-gradient(180deg,var(--gold-2),var(--accent-2))}
  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--edge);background:var(--card-2);color:var(--text);font-size:15px}
  .two{display:flex;gap:8px} .two>*{flex:1}
  .calc{margin-top:12px;padding:10px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);font-size:13px}
  .calc b{font-size:18px;color:var(--text)}
  .btn{display:block;width:100%;margin-top:12px;padding:11px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;
    border:1px solid rgba(255,230,160,.7);color:#1a1204;background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 45%,var(--gold-3));box-shadow:0 0 14px rgba(240,200,90,.35)}
  .btn.sub{background:var(--card-2);border:1px solid var(--edge);color:var(--muted);box-shadow:none;font-weight:normal}
  .btn.ng{background:transparent;border:1px solid var(--out);color:var(--out);box-shadow:none}
  .btn:disabled{opacity:.4}
  .qr{display:flex;justify-content:center;margin:12px 0 4px}
  .qr svg{background:#fff;border-radius:8px;padding:8px;width:180px;height:180px;box-shadow:0 0 0 2px var(--gold-3),0 0 18px var(--glow)}
  .center{text-align:center}
  .steps{font-size:12px;color:var(--muted);margin:0 0 8px;padding-left:18px}
  .steps li.now{color:var(--gold-1);font-weight:bold}
  .code{font-family:Consolas,monospace;font-size:11px;word-break:break-all;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--muted)}
  .key{font-size:12px;color:var(--in)}
  .cam{height:120px;border:2px dashed var(--edge);border-radius:12px;margin:12px 0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto;touch-action:none}
  .chart text{fill:var(--muted);font-size:10px}
  .tip{position:absolute;pointer-events:none;background:#0a0805;border:1px solid var(--edge);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--text);white-space:nowrap;display:none;z-index:2}
  .tip .t{color:var(--muted);margin-bottom:2px}
  .mark{font-size:30px;line-height:1;padding-right:6px}
  /* ウォレット残高の状態の記号：目のマークの右端から、次回分配予定の区切り線（.head のすき間 10px の先）までのちょうど真ん中 */
  .mark.mid{flex:1;text-align:center;padding:0;margin:0 -10px 0 -8px}  /* 左は .hero-row のすき間 8px、右は .head のすき間 10px を打ち消す */
  /* 目のマーク（EARN VIEWER と同じく残高の横） */
  .eye{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;flex:none;cursor:pointer;
    background:var(--card-2);border:1px solid var(--edge);color:var(--muted)}
  .eye.off{color:var(--gold-2)}
  /* 折り畳み：EARN VIEWER の fold（見出しの帯＋中身） */
  details.fold{margin-top:8px}
  details.fold>summary{cursor:pointer;font-size:12px;color:var(--muted);padding:6px 0;list-style:none}
  details.fold>summary::before{content:'▸ ';color:var(--gold-3)}
  details.fold[open]>summary::before{content:'▾ '}
  /* 折り畳み：外側の枠の中に題名と内容を入れる */
  details.sec{position:relative;margin-top:16px;padding:0 10px;border:1px solid var(--edge);border-radius:14px;
    background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%)}
  details.sec::before{content:'';position:absolute;top:-1px;left:18%;right:18%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold-1),transparent);box-shadow:0 0 14px 3px var(--glow);pointer-events:none}
  details.sec[open]{padding-bottom:10px}
  details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:12px 2px}
  details.sec[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  /* 内側の枠：外側より一段暗く、上辺の光はなし */
  details.sec .card{background:rgba(0,0,0,.30);border-color:var(--line)}
  details.sec .card::before{display:none}
  details.sec .card:last-child{margin-bottom:0}
  /* 内側の枠なし（プラットフォーム収益） */
  details.sec .plain{padding:0 4px;margin-top:-10px}  /* 題名の下の余白を打ち消し、1行目も線と線の真ん中に */
  details.sec>summary::before{content:'▸';color:var(--gold-2)}
  details.sec[open]>summary::before{content:'▾'}
  details summary::-webkit-details-marker{display:none}
  table.sum{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  table.sum th,table.sum td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  table.sum thead th{color:var(--muted);font-weight:normal}
  table.sum tbody th{text-align:left;font-weight:normal}  /* 項目名も1行（折り返さない） */
  table.sum tr.tot th,table.sum tr.tot td{font-weight:bold;border-bottom:none;border-top:2px solid var(--edge);color:var(--text)}
  /* 下のタブ：アイコンの下に名前 */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);background:rgba(10,8,5,.94);backdrop-filter:blur(6px);border-top:1px solid var(--edge)}
  .tabs div{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;color:var(--muted);
    cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
  .tabs div.on{color:var(--gold-1);border-top-color:var(--gold-2);text-shadow:0 0 10px var(--glow)}
  .tab-ic{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabs div.on .tab-ic{filter:drop-shadow(0 0 6px var(--glow))}
  /* スワイプで移る先を示す札（ESV と同じ動き。色は金）：画面の端の中ほど。指の動きに合わせて現れ、移ると決まったら進む向きへ流れる */
  #view{will-change:transform}
  .swipe-hint{position:fixed;top:50%;z-index:7;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 8px;border-radius:14px;background:rgba(28,21,10,.92);border:1px solid var(--edge);
    box-shadow:0 0 18px var(--glow);color:var(--gold-1);opacity:0;pointer-events:none;--p:0;
    transform:translateY(-50%) translateX(calc((1 - var(--p)) * var(--from)));transition:opacity .1s}
  .swipe-hint.right{right:8px;--from:16px}
  .swipe-hint.left{left:8px;--from:-16px}
  .swipe-hint .sh-arrow{font-size:34px;line-height:1;font-weight:700}
  .swipe-hint .sh-name{font-size:11px;white-space:nowrap}
  .swipe-hint.ready{background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#1a1204}
  .swipe-hint.ready .sh-arrow{animation:sh-pulse .5s ease-in-out infinite alternate}
  .swipe-hint.right.ready .sh-arrow{--dx:-4px}
  .swipe-hint.left.ready .sh-arrow{--dx:4px}
  @keyframes sh-pulse{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
  .swipe-hint.go{transition:transform .25s ease-in,opacity .25s ease-in;opacity:0 !important}
  .swipe-hint.right.go{transform:translateY(-50%) translateX(-60vw)}
  .swipe-hint.left.go{transform:translateY(-50%) translateX(60vw)}
  /* 設定タブ・合言葉の入力 */
  .kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:13px}
  .kv .kk{color:var(--muted)}
  /* 画像があるときは見出しを画像だけにする。行の高さはそのままで、ちょうど収まる大きさ（上下の余白を詰めて高さ 36px、横は金額の手前まで）、上下の真ん中 */
  .row.pf{padding:4px 0}
  .pf-start{margin-left:auto;font-size:12px;font-weight:normal;color:var(--muted)}  /* 題名の行の右端に運用開始日 */
  .pf-cell{flex:1;min-width:0;height:36px;display:flex;align-items:center}
  .pf-img{display:block;height:100%;max-width:100%;object-fit:contain;object-position:left center}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--edge);border-radius:14px;padding:16px;width:min(340px,90vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog input[type=password]{margin-top:8px}
  label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:10px 0 0}
  label.chk input{width:auto}
  /* お知らせ（ウォレット残高のカードの上）：押すと取引タブへ */
  .notice{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;
    color:var(--note-text);background:rgba(250,200,80,.10);border:1px solid rgba(243,214,143,.45)}
  .notice .go{margin-left:auto;font-size:12px;white-space:nowrap}
  .card>h2:first-child{margin:0 0 10px}  /* 設定タブ：見出しはカードの中 */
  .grid .yenl{display:block;margin-bottom:2px}  /* 個人別：数字のすぐ下に円の目安 */
  .inv-qr{display:flex;justify-content:center;margin:8px 0}
  .inv-qr svg{width:180px;height:180px;background:#fff;border-radius:8px;padding:6px;box-shadow:0 0 0 2px var(--gold-3)}
  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;max-width:90vw;
    padding:8px 14px;border-radius:10px;background:rgba(20,15,6,.95);border:1px solid var(--edge);color:var(--text);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .row .mini{flex:none;white-space:nowrap}
  .row.dsub{padding:4px 0 4px 16px;border-top:none}  /* 詳細の内訳の行（字下げ） */
  .row.dsub .l,.row.dsub .a{font-size:12px;color:var(--muted)}
  .addr{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}  /* 押すと名前を付けられるアドレス */
  .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--gold-2);color:#000;font-size:10px;margin-left:3px}
</style>
</head>

<script src="qrcode.js"></script>
<script>
const realToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
let TODAY = realToday();
// 試行データの基準日（設定タブで入れる。本番のデータでは使わない）："YYYY-MM-DD"。入れたらその日を「今日」とみなし、その日までの取引で表示する
let BASE = '';
const DIST_MONTHS = 3; // 分配は3か月に1回
// 今のレート（残高の円表示）：CoinGecko から取る。前回から1時間たっていたら取り直す（1時間に1回まで）。取れないときは前回の値
let RATE = null, RATE_AT = '';
// 支払い用：その日の日本時間10時のレート（仲値そのまま）。10時より前は前の日のレート。CoinGecko の値を取って端末に覚える
const DAY_RATE = loadJson('dist-manager-dayrate') || {};
// 読み込んだデータ（設定タブで読み込む）から作るもの
// people：人（Manager は全員、Agent は自分だけ）。SOTAI：相対のアドレス（ここへの送金は「相対へ移した」）
// txs の kind: recv=分配 give=相手のウォレットへ move=相対へ移した payThird=相対で支払い（円で入力）
//       out=相対・相手のアドレス以外への送金（cls: other=対象外 self=支出（自分の分として使った送金）〔どちらもエクセルで仕分け〕 null=未仕分け。どれもウォレットの残高は減る）
//       wout=相手のウォレットから送金（Agent の端末の中だけで仕分け。cls: spend=支出 other=対象外 null=未仕分け）
// consent: self=自分の分（印は出さない） wait=合意待ち ok=合意済み no=合意なし cancel=取り消し
let DATA = null, META = null, people = [], SOTAI = [], txs = [], ME = '';
// Manager：アプリで入れた支払い（added、データファイルと同じ形）と、データの支払いへの変更（changes：取り消し・合意）。
// エクセルに取り込まれて次のデータファイルに入ったら、端末からは外す。消えると戻せないので、バックアップに入れる
let LOCAL = {added: [], changes: {}};
let PASS = '';   // この起動で使った合言葉（バックアップの暗号化に使う。端末には覚えさせない）
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
const DATA_VERSION_MAX = 1, ENC_VERSION_MAX = 1;
let mode = 'me', tab = 'bal', filter = 'all', shown = 10;
// 残高の状態：手元の合計 ÷ 未払い
const MARKS = [[1.10,'◎','var(--in)','未払いの110%以上'],[1.00,'〇','var(--in)','100%以上'],[0.95,'△','var(--note-text)','95%以上'],[0,'×','var(--out)','95%未満']];
let payFlow = {step:0, tx:null};
let agreeFlow = {step:0, tx:null};
let seq = 100;

const KIND = {recv:'分配', give:'ウォレットへ', move:'相対へ移した', payThird:'相対で支払い', out:'対象外', wout:'ウォレットから送金'};
function loadJson(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function saveJson(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
let hide = false;
try { hide = localStorage.getItem('dist-manager-hide')==='1'; } catch(e){}
const MASK = '＊＊＊＊';
const f2 = n => hide ? MASK : n.toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2});
const fy = n => (hide ? MASK : Math.round(n).toLocaleString('ja-JP')) + ' 円';
const fu = n => '<span class="nw">' + f2(n) + '<span class="us"> USDT</span></span>';
const f1 = n => hide ? MASK : (Math.round(n*10)/10).toLocaleString('ja-JP',{minimumFractionDigits:1,maximumFractionDigits:1});
const fp = v => hide ? '＊＊' : v;           // 比率・割合・レート
const bw = v => hide ? '0%' : v;            // 棒の長さ
const eyeBtn = () => `<button class="eye ${hide?'off':''}" onclick="toggleHide()" aria-label="金額を隠す／見せる">${hide?EYE_OFF:EYE}</button>`;
function toggleHide(){ hide=!hide; try{ localStorage.setItem('dist-manager-hide', hide?'1':'0'); }catch(e){} render(true); }
const EYE = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.6 9.6 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
const yen = n => RATE ? '約 ' + fy(n*RATE) : '約 ― 円';
// 分配比率の表記：50% を 1口とする（25% は 0.5口）
const kuchi = r => (Math.round(r * 2 * 1000) / 1000) + '口';
const pname = id => people.find(p=>p.id===id).name;
const floor2 = n => Math.floor(n*100+1e-9)/100;
const toDate = d => { const [ymd, hm] = d.split(' '); const [y,m,dd] = ymd.split('/').map(Number); const [h,mi] = (hm||'0:0').split(':').map(Number); return new Date(y,m-1,dd,h,mi); };
const showD = d => { const x = toDate(d); return `${x.getMonth()+1}/${x.getDate()} ${d.split(' ')[1]}`; };
const shortD = dt => `${dt.getMonth()+1}/${dt.getDate()}`;

// 分配：相手は比率で切り捨て、残りは自分の分
const sharesOf = t => t.shares || shares(t.amt);
function shares(amt){
  const r = {};
  people.filter(p=>!p.self).forEach(p=>r[p.id]=floor2(amt*p.ratio));
  const self = people.find(p=>p.self);
  r[self.id] = floor2(amt - Object.values(r).reduce((a,b)=>a+b,0));
  return r;
}
// 支払日のレート（10時より前は前の日）。full は DAY_RATE の鍵（2026/10/23）
function rateFor(d){
  const dt = toDate(d);
  if(dt.getHours() < 10) dt.setDate(dt.getDate()-1);
  const full = `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
  return {key: shortD(dt), rate: DAY_RATE[full], full};
}
// 支払いのレート：データにあればそれ（入れたときのもの）、なければ支払日から
const rateOf = t => t.rate ? {key: shortD(toDate(t.rateDate.replace(/-/g,'/'))), rate: t.rate} : rateFor(t.d);
const usdtOf = t => t.kind==='payThird' ? (t.usdt ?? floor2(t.yen / rateOf(t).rate)) : t.amt;
const sorted = () => txs.slice().sort((a,b)=>toDate(a.d)-toDate(b.d));

// 未受領＝分配 − ウォレットへ送った − 相対で支払った
// ウォレット＝ウォレットへ送った − ウォレットからの支出（仕分けで「支出」にしたもの）
// 残高＝ウォレット＋未受領、支出＝相対で支払った＋ウォレットからの支出
const blank = () => ({alloc:0,give:0,usedHere:0,usedWallet:0,usedSelf:0});
function apply(per, t){
  if(t.consent==='cancel') return;
  const a = usdtOf(t);
  if(t.kind==='recv'){ const s=sharesOf(t); people.forEach(p=>per[p.id].alloc+=s[p.id]||0); }
  if(t.kind==='give') per[t.who].give+=a;
  if(t.kind==='payThird') per[t.who].usedHere+=a;
  if(t.kind==='out' && t.cls==='self') per[people.find(p=>p.self).id].usedSelf+=a;
  if(t.kind==='wout' && t.cls==='spend') per[t.who].usedWallet+=a;
}
function finish(x){
  x.unrec = x.alloc - x.give - x.usedHere;
  x.wallet = x.give - x.usedWallet;
  x.used = x.usedHere + x.usedWallet;
  x.bal = x.wallet + x.unrec;
  // 自分用：支払金＝ウォレット＋相対、預り金＝分配−支払金（相手のウォレットのその後は見ない）
  x.paid = x.give + x.usedHere + x.usedSelf;
  x.held = x.alloc - x.paid;
  return x;
}
function calc(){
  const per = {};
  people.forEach(p=>per[p.id]=blank());
  let addr=0, third=0;
  sorted().forEach(t=>{
    apply(per, t);
    if(t.consent==='cancel') return;
    const a = usdtOf(t);
    if(t.kind==='recv') addr+=a;
    if(t.kind==='give'||t.kind==='out') addr-=a;
    if(t.kind==='move'){ addr-=a; third+=a; }
    if(t.kind==='payThird') third-=a;
  });
  people.forEach(p=>finish(per[p.id]));
  return {per, addr, third};
}
// 次回分配予定：最後の分配から3か月後
function nextDist(){
  const last = sorted().filter(t=>t.kind==='recv').pop();
  if(!last) return '';
  const n = toDate(last.d); n.setMonth(n.getMonth()+DIST_MONTHS); n.setHours(0,0,0,0);
  const days = Math.round((n - TODAY)/86400000);
  return `<div class="next"><span class="label">次回分配予定</span><span class="d">${shortD(n)}</span><span class="y">あと${days}日</span></div>`;
}

// 分配＝支出＋ウォレット＋未受領
function bar(x){
  const w = v => (x.alloc? Math.max(0,v)/x.alloc*100:0).toFixed(2)+'%';
  return `<div class="bar"><span class="u" style="width:${bw(w(x.used))}"></span><span class="g" style="width:${bw(w(x.wallet))}"></span><span class="r" style="width:${bw(w(x.unrec))}"></span></div>`;
}
// 内訳の棒（分配の累計＝棒全体）と割合
function segs(x, parts){
  if(hide) return '';  // 目のマークで隠すときは棒を空に
  return parts.filter(([c,v])=>v>0).map(([c,v])=>`<span class="${c}" style="width:${bw((x.alloc? Math.max(0,v)/x.alloc*100:0).toFixed(2)+'%')}"></span>`).join('');
}
const pc = (v, all) => fp(Math.round(all? Math.max(0,v)/all*100 : 0) + '%');
const legend = `<div class="legend"><span><i style="background:var(--out)"></i>支出</span><span><i style="background:var(--sky)"></i>ウォレット</span><span><i style="background:var(--in)"></i>未受領</span><span>（ウォレット＋未受領＝残高）</span></div>`;
// Agent の残高の詳細：大きな行（金額と円の目安）と、その下に字下げした内訳の行
const dMain = (label, v) => `<div class="row"><div class="l"><b>${label}</b></div><div class="a"><b>${fu(v)}</b><div class="rate">${yen(v)}</div></div></div>`;
const dSub = (label, v) => `<div class="row dsub"><div class="l">${label}</div><div class="a">${fu(v)}</div></div>`;
function detail(x, ratioLabel){
  const main = dMain, sub = dSub;
  return main('分配累計' + (ratioLabel || ''), x.alloc)
    + main('支出', x.used) + sub('相対', x.usedHere) + sub('ウォレット', x.usedWallet)
    + main('残高', x.bal) + sub('受領済み（ウォレット）', x.wallet) + sub('未受領', x.unrec);
}
const rateLine = () => `<div class="rate">${RATE ? `1 USDT ＝ ${fp(RATE)} 円（${RATE_AT}）` : 'レートを取得できていません（つながったら取り直します）'}</div>`;

/* ---------- グラフ ---------- */
const CW = 448, CH = 200, PL = 40, PR = 8, PT = 10, PB = 24;
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/p/ (v/p>5?2:1))*p*(v/p>5?2:1); }
function yAxis(max){
  let h=''; for(let i=0;i<=4;i++){ const v=max*i/4, y=PT+(CH-PT-PB)*(1-i/4);
    h+=`<line x1="${PL}" x2="${CW-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${PL-6}" y="${y+3}" text-anchor="end">${hide?'＊':Math.round(v).toLocaleString()}</text>`; }
  return h;
}
// 分配の実績：分配ごとの棒（自分用は人ごとに積み上げ）
function distChart(ids){
  if(hide) return '<div class="s center" style="padding:24px 0">目のマークで隠しています</div>';
  const ds = sorted().filter(t=>t.kind==='recv');
  if(!ds.length) return '<div class="s center" style="padding:24px 0">分配はまだありません</div>';
  const vals = ds.map(t=>{ const s=sharesOf(t); return ids.map(id=>s[id]||0); });
  const max = niceMax(Math.max(...vals.map(v=>v.reduce((a,b)=>a+b,0))));
  const slot = (CW-PL-PR)/ds.length, bw = Math.min(36, slot*0.5), sy = v => (CH-PT-PB)*v/max;
  let h = yAxis(max);
  ds.forEach((t,i)=>{
    const x = PL + slot*i + (slot-bw)/2; let y = CH-PB;
    ids.forEach((id,k)=>{
      const hh = sy(vals[i][k]); const top = k===ids.length-1;
      const gap = k>0 ? 2 : 0;
      h += top
        ? `<path d="M${x},${y-gap} V${y-hh+4} Q${x},${y-hh} ${x+4},${y-hh} H${x+bw-4} Q${x+bw},${y-hh} ${x+bw},${y-hh+4} V${y-gap} Z" fill="${people.find(p=>p.id===id).color}"/>`
        : `<rect x="${x}" y="${y-hh+ (k>0?0:0)}" width="${bw}" height="${Math.max(0,hh-gap)}" fill="${people.find(p=>p.id===id).color}"/>`;
      y -= hh;
    });
    const tot = vals[i].reduce((a,b)=>a+b,0);
    h += `<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:var(--text)">${f2(tot)}</text>`;
    h += `<text x="${x+bw/2}" y="${CH-8}" text-anchor="middle">${shortD(toDate(t.d))}</text>`;
    h += `<rect x="${PL+slot*i}" y="${PT}" width="${slot}" height="${CH-PT-PB}" fill="transparent" data-i="${i}"/>`;
  });
  const tips = ds.map((t,i)=>`<div class="t">${toDate(t.d).getFullYear()}/${shortD(toDate(t.d))} 分配</div>` +
    ids.map((id,k)=>`<div><span class="sw" style="background:${people.find(p=>p.id===id).color}"></span>${pname(id)} ${fu(vals[i][k])}</div>`).join('') +
    (ids.length>1?`<div>合計 ${fu(vals[i].reduce((a,b)=>a+b,0))}</div>`:''));
  return chartBox('dist', h, tips, ids);
}
// 残高の推移：取引ごとに残高を追う階段の線
function balChart(ids, metric){
  if(hide) return '<div class="s center" style="padding:24px 0">目のマークで隠しています</div>';
  const per = {}; people.forEach(p=>per[p.id]=blank());
  const pts = [];
  sorted().filter(t=>metric!=='held'||sOf(t)).forEach(t=>{ apply(per,t); pts.push({dt:toDate(t.d), v:ids.map(id=>finish(per[id])[metric||'bal']), t}); });
  if(!pts.length) return '<div class="s center" style="padding:24px 0">まだありません</div>';
  pts.push({dt:TODAY, v:pts[pts.length-1].v, t:null});
  const t0 = new Date(pts[0].dt.getFullYear(),0,1), t1 = TODAY;
  const max = niceMax(Math.max(...pts.flatMap(p=>p.v)));
  const sx = dt => PL + (CW-PL-PR)*(dt-t0)/(t1-t0), sy = v => PT + (CH-PT-PB)*(1-v/max);
  let h = yAxis(max);
  for(let m=0;m<=t1.getMonth();m+=3){ const dt=new Date(t0.getFullYear(),m,1); h+=`<text x="${sx(dt)}" y="${CH-8}" text-anchor="middle">${m+1}月</text>`; }
  ids.forEach((id,k)=>{
    let d = `M${sx(t0)},${sy(0)}`;
    pts.forEach(p=>{ d += ` H${sx(p.dt)} V${sy(p.v[k])}`; });
    h += `<path d="${d}" fill="none" stroke="${people.find(p=>p.id===id).color}" stroke-width="2" stroke-linejoin="round" stroke-dasharray="${DASH[k]}"/>`;
    const last = pts[pts.length-1];
    if(ids.length===1) h += `<circle cx="${sx(last.dt)}" cy="${sy(last.v[k])}" r="4" fill="${people.find(p=>p.id===id).color}" stroke="var(--card)" stroke-width="2"/>`;
  });
  h += `<line class="xh" x1="0" x2="0" y1="${PT}" y2="${CH-PB}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  h += `<rect x="${PL}" y="${PT}" width="${CW-PL-PR}" height="${CH-PT-PB}" fill="transparent" data-line="1"/>`;
  window._balPts = {pts, ids, sx, t0, t1};
  return chartBox('bal', h, null, ids);
}
const DASH = ['', '6 4', '2 3'];
function chartBox(key, inner, tips, ids){
  window['_tips_'+key] = tips;
  const sample = (id,k) => key==='bal'
    ? `<svg width="22" height="8" style="vertical-align:middle;margin-right:4px"><line x1="1" y1="4" x2="21" y2="4" stroke="${people.find(p=>p.id===id).color}" stroke-width="2" stroke-dasharray="${DASH[k]}"/></svg>`
    : `<i style="background:${people.find(p=>p.id===id).color}"></i>`;
  const lg = ids.length>1 ? `<div class="legend" style="margin-top:6px">${ids.map((id,k)=>`<span>${sample(id,k)}${pname(id)}</span>`).join('')}</div>` : '';
  return `<div class="chart" id="c_${key}"><svg viewBox="0 0 ${CW} ${CH}">${inner}</svg><div class="tip"></div></div>${lg}`;
}
function hookCharts(){
  const d = document.getElementById('c_dist');
  if(d){ const tip=d.querySelector('.tip');
    d.querySelectorAll('rect[data-i]').forEach(r=>{
      const show=e=>{ tip.innerHTML=window._tips_dist[r.dataset.i]; tip.style.display='block'; place(d,tip,e); };
      r.addEventListener('pointerenter',show); r.addEventListener('pointermove',e=>place(d,tip,e)); r.addEventListener('pointerdown',show);
      r.addEventListener('pointerleave',()=>tip.style.display='none');
    }); }
  const b = document.getElementById('c_bal');
  if(b){ const tip=b.querySelector('.tip'), svg=b.querySelector('svg'), xh=b.querySelector('.xh'), hit=b.querySelector('rect[data-line]');
    const move=e=>{
      const {pts, ids, t0, t1} = window._balPts, box=svg.getBoundingClientRect();
      const vx = (e.clientX-box.left)/box.width*CW;
      const dt = new Date(+t0 + (t1-t0)*(vx-PL)/(CW-PL-PR));
      let p = pts[0]; pts.forEach(q=>{ if(q.dt<=dt) p=q; });
      const x = window._balPts.sx(p.dt); xh.setAttribute('x1',x); xh.setAttribute('x2',x); xh.style.display='';

}

function fakeQR(seed){
  const n=25, s=7.2; let r=[...String(seed)].reduce((a,c)=>(a*31+c.charCodeAt(0))%233280,7), out='';
  const rnd=()=>{ r=(r*9301+49297)%233280; return r/233280; };
  const finder=(x,y)=>`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="#000"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="#000"/>`;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16)) continue;
    if(rnd()<0.5) out+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#000"/>`;
  }
  return `<div class="qr"><svg viewBox="0 0 ${n*s} ${n*s}">${out}${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg></div>`;
}

function txTable(){

  const c = v => v ? fu(v) : '<span class="rate">—</span>';
  const rows = [
    ['分配', 0, recv, 0, null],
    ['ウォレット', give, 0, 0, null],
    ['相対', move, 0, pay, move-pay],
    ['支出', own, 0, 0, null],
    ['対象外', out, 0, 0, null],
    ['未仕分け', uns, 0, 0, null],
  ];
  const tot = ['合計', give+move+out+own+uns, recv, pay, recv-give-move-out-own-uns + move-pay];
  const tr = (r, b) => `<tr${b?' class="tot"':''}><th>${r[0]}</th><td>${c(r[1])}</td><td>${c(r[2])}</td><td>${c(r[3])}</td><td>${r[4]==null?'<span class="rate">—</span>':fu(r[4])}</td></tr>`;

async function importText(text, fileName, opt = {}){
  {

function validate(d){
  if(!d || d.format !== 'dist-data' || !d.generatedAt) throw new Error('DISTRIBUTION のデータファイルではありません');
  if(d.version > DATA_VERSION_MAX) throw new Error('このデータは新しい版のアプリ用です。アプリを開き直して更新してから、もう一度読み込んでください');

// 暗号の解き方は ESV と同じ（PBKDF2-SHA256 → AES-256-GCM）。覚えた合言葉を先に試し、だめなら聞く。やめたら null
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(enc, pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:enc.kdf.hash, salt:b64(enc.kdf.salt), iterations:enc.kdf.iterations}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.cipher.iv)}, key, b64(enc.data))));
}
async function decryptIfNeeded(json, noAsk){
  if(json.format !== 'dist-data-enc') return json;
  if(json.version > ENC_VERSION_MAX) throw new Error('このデータは新しい版のアプリ用です。アプリを開き直して更新してから、もう一度読み込んでください');
  const saved = localStorage.getItem('dist-manager-pass');
  if(saved){ try { const d = await decryptData(json, saved); PASS = saved; return d; } catch(e){ /* 合言葉が変わった → 聞く */ } }
  if(noAsk) return null;   // 開いたときの自動の読み込みでは、合言葉を聞かない
  let msg = '合言葉を入れてください';
  for(;;){
    const a = await askPass(msg);
    if(!a) return null;
    try {
      const d = await decryptData(json, a.pass);
      PASS = a.pass;
      try { if(a.save) localStorage.setItem('dist-manager-pass', a.pass); else localStorage.removeItem('dist-manager-pass'); } catch(e){}
      return d;
    } catch(e){ msg = '合言葉が違います。もう一度入れてください'; }
  }
}
function askPass(msg){
  return new Promise(resolve => {
    const dlg = document.getElementById('passDlg');
    document.getElementById('passMsg').textContent = msg;
    document.getElementById('passInput').value = '';
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok' && document.getElementById('passInput').value ? {pass: document.getElementById('passInput').value, save: document.getElementById('passSave').checked} : null), {once:true});
    dlg.showModal();
  });
}
/* ---------- バックアップ（Manager） ---------- */
// 中身：元のデータファイル（暗号のまま）・読み込みの記録・アプリで入れた支払いと変更。データファイルと同じ合言葉で暗号化する
// 置き場所：Google ドライブの「DISTRIBUTION バックアップ」フォルダ（決まった名前に上書き。ドライブは古い版もしばらく残す）、
//           またはダウンロード・共有。戻すときはドライブから、または［ファイルを読み込む］でそのファイルを選ぶ
const BK_NAME = 'DISTRIBUTION_backup_' + SCOPE + '.json', BK_FOLDER = 'DISTRIBUTION バックアップ';
function markDirty(){ try { localStorage.setItem('dist-manager-dirty', '1'); } catch(e){} }
const isDirty = () => { try { return localStorage.getItem('dist-manager-dirty') === '1'; } catch(e){ return false; } };
function backupDone(where){ saveJson('dist-manager-bk', {at: nowText(), where}); try { localStorage.removeItem('dist-manager-dirty'); } catch(e){} render(true); }
const b64e = u8 => { let t = ''; for(let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(t); };
async function encryptData(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations:600000}, base, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {format:'dist-backup-enc', version:1, kdf:{name:'PBKDF2', hash:'SHA-256', iterations:600000, salt:b64e(salt)}, cipher:{name:'AES-GCM', iv:b64e(iv)}, data:b64e(ct)};
}
// バックアップの合言葉：元のデータファイルで正しいと確かめたものだけを使う（打ち間違いで戻せないバックアップを作らない）
async function backupPass(src){
  for(const p of [PASS, (()=>{ try { return localStorage.getItem('dist-manager-pass') || ''; } catch(e){ return ''; } })()]){
    if(p){ try { await decryptData(src, p); PASS = p; return p; } catch(e){} }
  }
  let msg = 'バックアップの合言葉（データファイルと同じ）を入れてください';
  for(;;){
    const a = await askPass(msg);
    if(!a) return null;
    try { await decryptData(src, a.pass); PASS = a.pass; return a.pass; } catch(e){ msg = '合言葉が違います（データファイルと同じ合言葉です）'; }
  }
}
async function makeBackup(){
  const src = loadJson('dist-manager-src');
  if(!src) throw new Error('暗号化されたデータファイルを読み込んでから、バックアップを取ってください');
  const pass = await backupPass(src);
  if(!pass) return null;
  return JSON.stringify(await encryptData({format:'dist-backup', version:1, scope:SCOPE, createdAt:nowText(), src, meta:META, local:LOCAL, book:BOOK}, pass));
}
async function restoreBackup(json){
  if(json.version > 1) throw new Error('このバックアップは新しい版のアプリ用です。アプリを開き直して更新してから、もう一度読み込んでください');
  let b = null;
  for(const p of [PASS, (()=>{ try { return localStorage.getItem('dist-manager-pass') || ''; } catch(e){ return ''; } })()]){
    if(p && !b){ try { b = await decryptData(json, p); PASS = p; } catch(e){} }
  }
  let msg = 'バックアップの合言葉（データファイルと同じ）を入れてください';
  while(!b){
    const a = await askPass(msg);
    if(!a) return;
    try { b = await decryptData(json, a.pass); PASS = a.pass; } catch(e){ msg = '合言葉が違います。もう一度入れてください'; }
  }
  if(b.format !== 'dist-backup' || b.scope !== SCOPE) throw new Error('このファイルは ' + SCOPE_LABEL[SCOPE] + 'のバックアップではありません');
  const d = await decryptData(b.src, PASS);
  validate(d);
  if(DATA && !confirm('この端末のデータを、バックアップ（' + b.createdAt + '）の内容に置き換えますか？')) return;
  LOCAL = b.local || {added: [], changes: {}};
  if(b.book){ BOOK = b.book; saveBook(); }
  saveJson('dist-manager-local', LOCAL);
  saveJson('dist-manager-src', b.src);
  saveJson('dist-manager-data', {data: d, meta: b.meta});
  saveJson('dist-manager-bk', {at: b.createdAt, where: '戻したバックアップ'});
  try { localStorage.removeItem('dist-manager-dirty'); } catch(e){}
  useData(d, b.meta);
  tab = 'bal'; render();
  alert('バックアップ（' + b.createdAt + '）から戻しました');
}
function backupDownload(){
  makeBackup().then(text => {
    if(!text) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = BK_NAME; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    backupDone('ダウンロード');
  }).catch(e => alert(e.message));
}
async function backupShare(){

// 新しい版の Service Worker に入れ替わるまで待つ（最大 ms）。入れ替わったら true
function waitForNewWorker(reg, ms){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    navigator.serviceWorker.addEventListener('controllerchange', () => finish(true), {once: true});
    const watch = w => w && w.addEventListener('statechange', () => { if(w.state === 'activated') finish(true); if(w.state === 'redundant') finish(false); });
    watch(reg.installing); watch(reg.waiting);
    reg.addEventListener('updatefound', () => watch(reg.installing));
    if(reg.waiting) reg.waiting.postMessage('skipWaiting');
    setTimeout(() => finish(false), ms);
  });
}
async function applyUpdate(){
  document.getElementById('status').textContent = '更新中…';
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg){
      const waiting = waitForNewWorker(reg, 15000);
      await reg.update();
      const ok = await waiting;
      if(!ok && !(await newerVersion())){
        showStatus();
        alert('新しいバージョンの準備ができませんでした。公開の直後は、反映まで数分かかることがあります。少し待ってから、もう一度お試しください。');
        return;
      }
    }
  } catch(e){ /* 失敗しても再読み込みで取り直す */ }
  location.reload();
}

    const latest = await newerVersion();
    if(latest){ if(confirm('新しいバージョン（' + latest + '）があります。更新しますか？')) await applyUpdate(); }
    else alert('最新のバージョンです（0.7.4）');
  } catch(e){ alert('更新を確認できませんでした（通信を確認してください）'); }
  finally { btn.disabled = false; }
}

// 支払日のレート：その日の日本時間10時に一番近い値（前後1時間半の中から）。取れたら端末に覚える
async function fetchDayRate(full){
  if(DAY_RATE[full]) return true;
  const [y,m,d] = full.split('/').map(Number);
  const t10 = Date.UTC(y, m-1, d, 1, 0) / 1000;   // 日本時間10時＝世界時1時
  try {
    const j = await (await fetch(`https://api.coingecko.com/api/v3/coins/tether/market_chart/range?vs_currency=jpy&from=${t10-5400}&to=${t10+5400}`)).json();
    if(!j || !Array.isArray(j.prices) || !j.prices.length) return false;
    const best = j.prices.reduce((a,b)=>Math.abs(b[0]-t10*1000) < Math.abs(a[0]-t10*1000) ? b : a);
    DAY_RATE[full] = Math.round(best[1] * 100) / 100;
    saveJson('dist-manager-dayrate', DAY_RATE);
    return true;
  } catch(e){ return false; }
}

const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInAppBrowser = () => /\bLine\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(navigator.userAgent);
let recvBusy = false, recvState = '';
// 招待リンクで開いたときの招待コード。読んだらアドレス欄からすぐ消す（履歴やブックマークに残さない）
function takeInviteFromUrl(){
  const id = /invite=/.test(location.hash) ? inviteIdOf(location.hash) : null;
  if(/invite=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  return id;
}
// 招待を受け取る：ログインなしで読み、合言葉で開けたら、そのファイルを覚える（開けなければ何も変えない）
async function acceptInvite(id){
  if(recvBusy) return;
  const slot = loadJson('dist-manager-drive');
  if(slot && slot.id === id){ checkPublic(true); return; }   // 同じ招待をもう一度開いた
  recvBusy = true;
  try {
    let meta;
    try { meta = await Public.meta(id); } catch(e){
      alert('招待のデータを受け取れませんでした。招待コード（リンク）が正しいか、通信の状態を確かめてください。続くときは、Manager に共有の設定を確かめてもらってください。');
      return;
    }
    if(DATA && !confirm('招待を受け取りました。今のデータを、招待されたデータに置き換えますか？')) return;
    const ok = await importText(await Public.text(id), meta.name, {quiet: true});
    if(!ok) return;   // 合言葉の入力をやめた
    saveJson('dist-manager-drive', {id, name: meta.name, md5: meta.md5Checksum, checkedAt: nowText()});
    recvState = 'ok'; render(true);
    if(isStandalone()) toast('データを受け取りました（作成 ' + DATA.generatedAt + '）');
    else showInviteDone(id);
  } catch(e){ alert('受け取れませんでした（' + e.message + '）'); }
  finally { recvBusy = false; }
}

// 開いたとき（manual でない）：変わっていれば、覚えた合言葉で開けるときだけ読み込む
async function checkPublic(manual){
  const slot = loadJson('dist-manager-drive');
  if(!slot){ if(manual) alert('受け取り先が決まっていません。招待リンクを開くか、［招待コードを入れる］から始めてください。'); return; }
  if(recvBusy) return;
  recvBusy = true;
  try {
    const meta = await Public.meta(slot.id);
    slot.checkedAt = nowText(); recvState = 'ok';
    if(manual || meta.md5Checksum !== slot.md5){
      const ok = await importText(await Public.text(slot.id), meta.name, {quiet: true, noAsk: !manual});
      if(ok){ slot.md5 = meta.md5Checksum; slot.name = meta.name; toast('新しいデータを読み込みました（作成 ' + DATA.generatedAt + '）'); }
      else if(!manual) toast('新しいデータがあります。設定タブの［最新データを取得］で読み込んでください');
    } else if(manual) toast('最新のデータです（作成 ' + (DATA ? DATA.generatedAt : '—') + '）');
    saveJson('dist-manager-drive', slot);
  } catch(e){
    recvState = 'ng';
    if(manual) alert('受け取れませんでした。通信の状態を確かめてください。続くときは、Manager に共有の設定を確かめてもらってください。');

}

// 横にスワイプすると隣のタブへ（左へスワイプで右隣、右へで左隣）。ESV と同じ動き：ページは指についてきて、離すと次のページが横から滑り込む（0.15 秒）
// 動かしている間は、移る先の側に矢印と行き先のタブ名を出す。画面幅の 20% 未満でゆっくり離したときは元に戻る。両端のタブでは重く動いて戻る
// 入力欄・グラフ（指でなぞって値を見る）・下のタブ・横にスクロールできるものの上では動かさない
(() => {
  const SLIDE_MS = 150;
  const hint = document.createElement('div');
  hint.className = 'swipe-hint';
  hint.innerHTML = '<span class="sh-arrow"></span><span class="sh-name"></span>';
  document.body.appendChild(hint);
  const showHint = (dir, name, p) => { // dir：-1＝次（右端）、1＝前（左端）、p：0〜1
    hint.classList.toggle('left', dir > 0); hint.classList.toggle('right', dir < 0);
    hint.querySelector('.sh-arrow').textContent = dir < 0 ? '›' : '‹';
    hint.querySelector('.sh-name').textContent = name;
    hint.style.opacity = String(Math.min(1, p * 1.6));
    hint.style.setProperty('--p', String(Math.min(1, p)));
    hint.classList.toggle('ready', p >= 1);
  };
  const hideHint = (go) => { hint.classList.remove('ready'); if (go) { hint.classList.add('go'); setTimeout(() => { hint.classList.remove('go'); hint.style.opacity = '0'; }, 260); } else hint.style.opacity = '0'; };
  let sx = 0, sy = 0, st = 0, armed = false, dir = '', dx = 0, busy = false;
  const page = document.getElementById('view');
  const scrollsX = (e) => { for (let n = e; n && n !== document.body; n = n.parentElement) { if (n.scrollWidth > n.clientWidth + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true; } return false; };
  const tabEls = () => [...document.querySelectorAll('#tabs > div')];
  const curIndex = () => tabEls().findIndex((b) => b.classList.contains('on'));
  const tabName = (b) => b.querySelector('span').firstChild.textContent.trim(); // 件数の印は除く
  const slide = (el, x, ms) => { el.style.transition = ms ? 'transform ' + ms + 'ms ease-out' : 'none'; el.style.transform = x ? 'translateX(' + x + 'px)' : ''; };
  const after = (ms) => new Promise((r) => setTimeout(r, ms + 20));
  document.addEventListener('touchstart', (ev) => {
    armed = false; dir = ''; dx = 0;
    if (busy || ev.touches.length !== 1) return;
    const t = ev.target;
    if (t.closest('input, select, textarea, .chart, .tabs') || scrollsX(t)) return;
    sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; st = Date.now(); armed = true;
  }, { passive: true });
  document.addEventListener('touchmove', (ev) => {
    if (!armed) return;
    const mx = ev.touches[0].clientX - sx, my = ev.touches[0].clientY - sy;
    if (!dir) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      dir = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'y'; // 最初の動きで、横（タブ移動）か縦（スクロール）かを決める
    }
    if (dir !== 'x') return;
    ev.preventDefault(); // 横に動かしている間は、縦にスクロールさせない
    const j = curIndex() + (mx < 0 ? 1 : -1);
    const has = j >= 0 && j < tabEls().length;
    dx = has ? mx : mx / 4; // 端のタブでは重く
    slide(page, dx, 0);
    if (has) showHint(mx < 0 ? -1 : 1, tabName(tabEls()[j]), Math.abs(dx) / (window.innerWidth * 0.2)); else hideHint(false);
  }, { passive: false });
  document.addEventListener('touchend', async () => {
    if (!armed || dir !== 'x') { armed = false; return; }
    armed = false;
    const w = window.innerWidth;
    const j = curIndex() + (dx < 0 ? 1 : -1);
    const fast = Math.abs(dx) > 25 && Date.now() - st < 300; // すばやく払ったときは短くても移る
    if (j < 0 || j >= tabEls().length || (Math.abs(dx) < w * 0.2 && !fast)) { hideHint(false); slide(page, 0, SLIDE_MS); await after(SLIDE_MS); slide(page, 0, 0); return; }
    hideHint(true);
    busy = true;
    const d = dx < 0 ? -1 : 1;
    slide(page, d * w, SLIDE_MS); // 今のページを外へ
    await after(SLIDE_MS);
    slide(page, 0, 0);
    tabEls()[j].click(); // タブを切り替えて描き直す（一番上へ戻る）
    slide(page, -d * w, 0); page.getBoundingClientRect(); slide(page, 0, SLIDE_MS); await after(SLIDE_MS); slide(page, 0, 0); // 次のページを反対側から
    busy = false;
  });
  document.addEventListener('touchcancel', () => { if (armed) slide(page, 0, SLIDE_MS); hideHint(false); armed = false; });
})();
