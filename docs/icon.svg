<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1f0c"/><stop offset=".55" stop-color="#120d06"/><stop offset="1" stop-color="#050403"/></linearGradient>
    <radialGradient id="bgGlow" cx=".5" cy=".18" r=".75"><stop offset="0" stop-color="#6b4d14" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8"/><stop offset=".35" stop-color="#f0cd6a"/><stop offset=".7" stop-color="#c9982c"/><stop offset="1" stop-color="#8a6414"/></linearGradient>
    <linearGradient id="goldD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe4a0"/><stop offset=".5" stop-color="#d6a53a"/><stop offset="1" stop-color="#7a5512"/></linearGradient>
    <linearGradient id="goldL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#f3d27a"/></linearGradient>
    <linearGradient id="goldK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a2a"/><stop offset="1" stop-color="#5e430c"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c1"/><stop offset=".5" stop-color="#c99a2e"/><stop offset="1" stop-color="#fff1c1"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="k5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".5" stop-color="#ffe9b0"/><stop offset="1" stop-color="#e8c470"/></linearGradient>
    <filter id="lglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- 土台：角の丸い黒地、上からの光、金の縁 -->
  <rect width="120" height="120" rx="26" fill="url(#bgG)"/>
  <rect width="120" height="120" rx="26" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="url(#rim)" stroke-width="2.5" opacity=".9"/>
  <!-- 金の金庫 -->
  <g filter="url(#glow)">
    <rect x="24" y="26" width="72" height="66" rx="9" fill="url(#goldD)"/>
    <rect x="30" y="32" width="60" height="54" rx="6" fill="url(#gold)"/>
    <circle cx="60" cy="59" r="16" fill="url(#goldK)"/>
    <circle cx="60" cy="59" r="11" fill="url(#goldL)"/>
    <g stroke="#fff3c8" stroke-width="1.4">
      <line x1="60" y1="45.5" x2="60" y2="43.5"/><line x1="66.8" y1="47.3" x2="67.8" y2="45.6"/><line x1="71.7" y1="52.3" x2="73.4" y2="51.3"/>
      <line x1="73.5" y1="59" x2="75.5" y2="59"/><line x1="71.7" y1="65.8" x2="73.4" y2="66.8"/><line x1="66.8" y1="70.7" x2="67.8" y2="72.4"/>
      <line x1="60" y1="72.5" x2="60" y2="74.5"/><line x1="53.3" y1="70.7" x2="52.3" y2="72.4"/><line x1="48.3" y1="65.8" x2="46.6" y2="66.8"/>
      <line x1="46.5" y1="59" x2="44.5" y2="59"/><line x1="48.3" y1="52.3" x2="46.6" y2="51.3"/><line x1="53.3" y1="47.3" x2="52.3" y2="45.6"/>
    </g>
    <rect x="58" y="49" width="4" height="10" rx="2" fill="#6b4c10"/>
    <rect x="32" y="92" width="12" height="6" rx="2" fill="url(#goldK)"/>
    <rect x="76" y="92" width="12" height="6" rx="2" fill="url(#goldK)"/>
  </g>
  <!-- 右下の文字（Manager）：金庫の上でも読めるよう濃い縁取り -->
  <text x="86" y="100" text-anchor="middle" font-family="Monotype Corsiva" font-size="42" fill="url(#k5)" stroke="#2a1d06" stroke-width="2.2" paint-order="stroke" filter="url(#lglow)">M</text>
</svg>
